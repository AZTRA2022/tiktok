services:
  postgres:
    image: postgres:latest
    container_name: tiktok-database-container
    environment:
      POSTGRES_USER: tiktok-user
      POSTGRES_PASSWORD: tiktok-password
      POSTGRES_DB: tiktok-db
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: tiktok-storage-container
    restart: unless-stopped
    ports:
      - "0.0.0.0:3900:3900"
      - "0.0.0.0:3903:3903"

    volumes:
      - garage-data:/var/lib/garage
      - ./docker/garage/garage.toml:/etc/garage.toml:ro

volumes:
  postgres-data:
  garage-data:
